<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generated LinkedIn Message</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0d1c;
            color: #ffffff;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #1a1a2e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
        }

        h2 {
            color: #00ff80;
            margin-bottom: 20px;
        }

        #generated-message {
            background: #2e2e4d;
            color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            min-height: 100px;
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 16px;
        }

        .button-group button {
            margin-right: 10px;
            padding: 10px 18px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .copy-btn {
            background-color: #00ff80;
            color: #000;
        }

        .edit-btn {
            background-color: #ffaa00;
            color: #000;
        }

        .regen-btn {
            background-color: #555;
            color: #fff;
        }

        .button-group button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Your LinkedIn Message</h2>
        <div id="generated-message" contenteditable="false">{{ message }}</div>

        <div class="button-group">
            <button class="copy-btn" onclick="copyToClipboard()">Copy</button>
            <button class="edit-btn" onclick="enableEdit()">Edit</button>
            <button class="regen-btn" onclick="regenerate()">Regenerate</button>
        </div>
    </div>

    <script>
        function copyToClipboard() {
            const text = document.getElementById('generated-message').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Copied to clipboard!");
            });
        }

        function enableEdit() {
            const msgDiv = document.getElementById('generated-message');
            msgDiv.setAttribute('contenteditable', true);
            msgDiv.focus();
        }

        function regenerate() {
            alert("Regeneration feature coming soon.");
        }
    </script>
</body>
</html>
